gripper_xml: assets/grippers/omnipicker/ominipicker.xml
participants: [28]
angular_bins: 16
axial_bins: 8
hotspot_count: 4
contact_threshold: 0.5
envelope_coverage: 0.5
interval_quantiles: [0.1, 0.9]
tasks:
  hammer:
    source_object: hammer
    target_frame: "hammer_Object: +X working-to-free; +Y transverse; u_RL=x/handle_half_length"
    context: {tool_working_end: hammer_head, primary_load_type: impact}
  broom:
    source_object: flashlight
    target_frame: "canonical only; no broom MuJoCo task registered"
    context: {tool_working_end: brush_head, primary_load_type: tangential, proxy_source: flashlight}
  knife:
    source_object: knife
    target_frame: "canonical only; no knife MuJoCo task registered"
    context: {tool_working_end: blade, primary_load_type: cutting}
